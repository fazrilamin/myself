name: Update README

on:
  schedule:
    - cron: "17 1 * * *" # daily 01:17 UTC (09:17 MYT); the gate below decides whether to commit
  workflow_dispatch:
    inputs:
      force:
        description: "Commit even if the last commit is recent"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Decide whether to commit today
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          gap_days=$(( (now - last) / 86400 ))
          echo "Days since last commit: $gap_days"

          if [ "$FORCE" = "true" ]; then
            go=true
          elif [ "$gap_days" -ge 3 ]; then
            go=true
          elif [ "$gap_days" -ge 2 ] && [ $((RANDOM % 2)) -eq 0 ]; then
            go=true
          else
            go=false
          fi

          echo "Commit today: $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update README with Spotify recently played
        if: steps.gate.outputs.go == 'true'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit and push
        if: steps.gate.outputs.go == 'true'
        run: |
          # Commit as the account owner so it counts on the contribution graph.
          git config user.name "fazrilamin"
          git config user.email "175499730+fazrilamin@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "🎧 Update recently played"
          git push
